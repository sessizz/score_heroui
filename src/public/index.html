<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Voleybol Canlı Skorboard & Yayın Paneli</title>
  <link rel="stylesheet" href="/css/common.css">
  <link rel="icon" href="/assets/volleyball.svg">
  <style>
    .home-container {
      max-width: 1160px;
      margin: 0 auto;
      padding: 24px 20px 80px;
    }
    .top-nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 32px;
      padding-bottom: 18px;
      border-bottom: 1px solid var(--border-color);
      flex-wrap: wrap;
      gap: 16px;
    }
    .nav-brand {
      display: flex;
      align-items: center;
      gap: 12px;
      font-weight: 900;
      font-size: 1.4rem;
      color: #ffffff;
      text-decoration: none;
      letter-spacing: -0.5px;
    }
    .nav-brand span span {
      color: var(--fb-yellow, #ffed00);
    }
    .nav-brand img {
      width: 32px;
      height: 32px;
    }
    .nav-user {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }
    .user-pill {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid var(--border-color);
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 0.85rem;
      font-weight: 600;
      color: #cbd5e1;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .btn-nav {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 8px 16px;
      border-radius: 8px;
      font-weight: 700;
      font-size: 0.88rem;
      text-decoration: none;
      border: 1px solid var(--border-color);
      background: rgba(255, 255, 255, 0.05);
      color: #ffffff;
      cursor: pointer;
      transition: all 0.2s;
    }
    .btn-nav:hover {
      background: rgba(255, 255, 255, 0.12);
      border-color: rgba(255, 255, 255, 0.25);
    }
    .btn-nav-primary {
      background: var(--fb-yellow, #ffed00);
      color: #002d72;
      border: none;
    }
    .btn-nav-primary:hover {
      background: #fff033;
    }
    .btn-logout {
      background: rgba(220, 38, 38, 0.15);
      border: 1px solid rgba(220, 38, 38, 0.3);
      color: #fca5a5;
    }
    .btn-logout:hover {
      background: rgba(220, 38, 38, 0.25);
    }
    .hero-section {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 28px;
      flex-wrap: wrap;
      gap: 16px;
    }
    .hero-title {
      font-size: 1.8rem;
      font-weight: 900;
      color: #ffffff;
      margin-bottom: 4px;
    }
    .hero-desc {
      color: var(--text-muted);
      font-size: 0.95rem;
    }
    .boards-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(360px, 1fr));
      gap: 24px;
    }
    .board-card {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 14px;
      padding: 22px;
      box-shadow: var(--shadow-sm);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      transition: transform 0.2s, border-color 0.2s;
    }
    .board-card:hover {
      border-color: rgba(255, 237, 0, 0.4);
      transform: translateY(-2px);
    }
    .board-header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 14px;
    }
    .board-title {
      font-size: 1.25rem;
      font-weight: 800;
      color: #ffffff;
      line-height: 1.3;
    }
    .board-sub {
      font-size: 0.82rem;
      color: var(--text-muted);
      margin-top: 2px;
    }
    .board-match-preview {
      background: #0b1120;
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 10px;
      padding: 12px 14px;
      margin: 12px 0 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .preview-team {
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: 800;
      font-size: 0.95rem;
    }
    .preview-team img {
      width: 22px;
      height: 22px;
      object-fit: contain;
    }
    .preview-score {
      font-size: 1.1rem;
      font-weight: 900;
      color: var(--fb-yellow, #ffed00);
      background: rgba(255, 237, 0, 0.12);
      padding: 4px 10px;
      border-radius: 6px;
    }
    .links-accordion-title {
      font-size: 0.8rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--text-muted);
      margin-bottom: 10px;
    }
    .link-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.06);
      border-radius: 8px;
      padding: 8px 10px;
      margin-bottom: 6px;
      gap: 8px;
    }
    .link-info {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.85rem;
      font-weight: 700;
      color: #e2e8f0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .link-actions {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-shrink: 0;
    }
    .btn-action-sm {
      padding: 4px 8px;
      border-radius: 5px;
      font-size: 0.76rem;
      font-weight: 700;
      text-decoration: none;
      border: 1px solid var(--border-color);
      background: rgba(255, 255, 255, 0.08);
      color: #ffffff;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      transition: all 0.15s;
    }
    .btn-action-sm:hover {
      background: rgba(255, 255, 255, 0.18);
    }
    .btn-action-sm.btn-primary {
      background: var(--fb-yellow, #ffed00);
      color: #002d72;
      border: none;
    }
    .btn-action-sm.btn-primary:hover {
      background: #fff033;
    }
    .btn-action-sm.btn-op {
      background: rgba(16, 185, 129, 0.2);
      border-color: rgba(16, 185, 129, 0.4);
      color: #6ee7b7;
    }
    .btn-action-sm.btn-op:hover {
      background: rgba(16, 185, 129, 0.3);
    }
    .btn-delete-board {
      background: transparent;
      border: none;
      color: #94a3b8;
      cursor: pointer;
      padding: 4px;
      border-radius: 4px;
      transition: color 0.15s;
    }
    .btn-delete-board:hover {
      color: #ef4444;
    }
    .empty-state {
      text-align: center;
      padding: 60px 20px;
      background: var(--bg-card);
      border: 1px dashed var(--border-color);
      border-radius: 16px;
      grid-column: 1 / -1;
    }
    .empty-icon {
      font-size: 3rem;
      margin-bottom: 12px;
    }
    .empty-title {
      font-size: 1.3rem;
      font-weight: 800;
      color: #ffffff;
      margin-bottom: 6px;
    }
    .empty-desc {
      color: var(--text-muted);
      font-size: 0.92rem;
      max-width: 480px;
      margin: 0 auto 20px;
    }

    /* Modal */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.75);
      backdrop-filter: blur(6px);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
      z-index: 999;
    }
    .modal-card {
      background: #162447;
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 14px;
      padding: 28px;
      max-width: 480px;
      width: 100%;
      box-shadow: 0 20px 45px rgba(0, 0, 0, 0.6);
    }
    .modal-title {
      font-size: 1.3rem;
      font-weight: 800;
      color: #ffffff;
      margin-bottom: 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .modal-close {
      background: transparent;
      border: none;
      color: var(--text-muted);
      font-size: 1.4rem;
      cursor: pointer;
    }
    .modal-group {
      margin-bottom: 14px;
    }
    .modal-label {
      display: block;
      font-size: 0.8rem;
      font-weight: 700;
      color: var(--text-muted);
      text-transform: uppercase;
      margin-bottom: 5px;
    }
    .modal-input, .modal-select {
      width: 100%;
      padding: 10px 12px;
      background: #0b1120;
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 8px;
      color: #ffffff;
      font-size: 0.92rem;
      outline: none;
      box-sizing: border-box;
    }
    .modal-input:focus, .modal-select:focus {
      border-color: var(--fb-yellow, #ffed00);
    }
    .modal-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }
  </style>
</head>
<body>

<div class="home-container">
  <!-- Top Nav -->
  <header class="top-nav">
    <a href="/" class="nav-brand">
      <img src="/assets/volleyball.svg" alt="Logo">
      <span>Voleybol<span>Skor</span></span>
    </a>
    <div class="nav-user" id="nav-user-section">
      <span class="user-pill" id="user-email-pill">👤 Yükleniyor...</span>
      <a href="/teams" class="btn-nav">🏐 Takımlar</a>
      <a href="/obs/README.md" target="_blank" class="btn-nav" style="background: rgba(16, 185, 129, 0.15); border-color: rgba(16, 185, 129, 0.35); color: #6ee7b7;">⌨️ OBS Kısayolları</a>
      <button class="btn-nav btn-nav-primary" id="btn-new-board">+ Yeni Skorboard</button>
      <button class="btn-nav btn-logout" id="btn-logout">Çıkış Yap</button>
    </div>
  </header>

  <!-- Hero / Header -->
  <div class="hero-section">
    <div>
      <h1 class="hero-title">Skorboardlarım</h1>
      <p class="hero-desc">Yayınlarınız ve maçlarınız için canlı skorboard panelleriniz</p>
    </div>
    <div>
      <button class="btn-nav btn-nav-primary" id="btn-hero-new">+ Yeni Skorboard Ekle</button>
    </div>
  </div>

  <!-- Boards Grid -->
  <div class="boards-grid" id="boards-grid">
    <!-- Populated by JS -->
  </div>
</div>

<!-- New Board Modal -->
<div class="modal-backdrop" id="modal-new-board">
  <div class="modal-card">
    <div class="modal-title">
      <span>🏐 Yeni Skorboard Oluştur</span>
      <button class="modal-close" id="btn-close-modal">&times;</button>
    </div>
    <form id="form-create-board">
      <div class="modal-group">
        <label class="modal-label" for="board-title">Maç / Lig Başlığı</label>
        <input type="text" id="board-title" class="modal-input" placeholder="Örn: Genç Erkekler Voleybol Ligi" required>
      </div>

      <div class="modal-group">
        <label class="modal-label" for="board-subtitle">Alt Başlık</label>
        <input type="text" id="board-subtitle" class="modal-input" placeholder="Örn: Canlı Yayın">
      </div>

      <div class="modal-group">
        <label class="modal-label" for="board-preset">Tasarım & Renk Şablonu</label>
        <select id="board-preset" class="modal-select">
          <option value="fenerbahce">Fenerbahçe Sarı-Lacivert Şablonu</option>
          <option value="generic">Genel Voleybol (Mavi / Kırmızı) Şablonu</option>
        </select>
      </div>

      <!-- 1. TAKIM (EV SAHİBİ) -->
      <div style="margin-top: 14px; margin-bottom: 6px; font-weight: 800; font-size: 0.85rem; color: var(--fb-yellow, #ffed00);">
        1. TAKIM (EV SAHİBİ)
      </div>
      <div class="modal-group">
        <label class="modal-label" for="select-team-a">Kayıtlı Takımlardan Seç (İsteğe Bağlı)</label>
        <select id="select-team-a" class="modal-select">
          <option value="">-- Kayıtlı Takımlardan Seç (veya aşağıdan elle girin) --</option>
        </select>
      </div>
      <div class="modal-row">
        <div class="modal-group">
          <label class="modal-label" for="team-a-name">Takım Adı</label>
          <input type="text" id="team-a-name" class="modal-input" placeholder="FENERBAHÇE" required>
        </div>
        <div class="modal-group">
          <label class="modal-label" for="team-a-short">Kısa Kod</label>
          <input type="text" id="team-a-short" class="modal-input" placeholder="FB" maxlength="5">
        </div>
      </div>

      <!-- 2. TAKIM (DEPLASMAN) -->
      <div style="margin-top: 10px; margin-bottom: 6px; font-weight: 800; font-size: 0.85rem; color: #fca5a5;">
        2. TAKIM (DEPLASMAN)
      </div>
      <div class="modal-group">
        <label class="modal-label" for="select-team-b">Kayıtlı Takımlardan Seç (İsteğe Bağlı)</label>
        <select id="select-team-b" class="modal-select">
          <option value="">-- Kayıtlı Takımlardan Seç (veya aşağıdan elle girin) --</option>
        </select>
      </div>
      <div class="modal-row">
        <div class="modal-group">
          <label class="modal-label" for="team-b-name">Takım Adı</label>
          <input type="text" id="team-b-name" class="modal-input" placeholder="RAKİP TAKIM" required>
        </div>
        <div class="modal-group">
          <label class="modal-label" for="team-b-short">Kısa Kod</label>
          <input type="text" id="team-b-short" class="modal-input" placeholder="RAK" maxlength="5">
        </div>
      </div>

      <button type="submit" class="btn-nav btn-nav-primary" style="width: 100%; justify-content: center; padding: 12px; margin-top: 8px;" id="btn-submit-board">
        Skorboardu Oluştur
      </button>
    </form>
  </div>
</div>

<script>
  let currentUser = null;
  let userTeams = [];
  let selectedTeamA = null;
  let selectedTeamB = null;
  const origin = window.location.origin;

  // Check Authentication
  async function checkAuth() {
    try {
      const res = await fetch('/api/auth/me');
      const data = await res.json();
      if (!data.authenticated || !data.user) {
        window.location.href = '/login';
        return;
      }
      currentUser = data.user;
      document.getElementById('user-email-pill').textContent = `👤 ${currentUser.email}`;
      loadBoards();
      loadUserTeams();
    } catch (e) {
      window.location.href = '/login';
    }
  }

  // Load User Teams for dropdowns
  async function loadUserTeams() {
    try {
      const res = await fetch('/api/teams');
      const data = await res.json();
      if (data.success && Array.isArray(data.teams)) {
        userTeams = data.teams;
        populateTeamSelects();
      }
    } catch (err) {
      console.error('Takımlar yüklenemedi:', err);
    }
  }

  function populateTeamSelects() {
    const selA = document.getElementById('select-team-a');
    const selB = document.getElementById('select-team-b');
    if (!selA || !selB) return;

    const defaultOpt = '<option value="">-- Kayıtlı Takımlardan Seç (veya aşağıdan elle girin) --</option>';
    const options = userTeams.map(t => `<option value="${t.id}">${escapeHtml(t.name)} ${t.shortName ? `(${escapeHtml(t.shortName)})` : ''}</option>`);

    selA.innerHTML = defaultOpt + options.join('');
    selB.innerHTML = defaultOpt + options.join('');
  }

  // Logout
  document.getElementById('btn-logout').addEventListener('click', async () => {
    try {
      await fetch('/api/auth/logout', { method: 'POST' });
      window.location.href = '/login';
    } catch (e) {
      window.location.href = '/login';
    }
  });

  // Load Boards
  async function loadBoards() {
    const grid = document.getElementById('boards-grid');
    grid.innerHTML = '<div style="color: var(--text-muted); padding: 20px;">Skorboardlar yükleniyor...</div>';

    try {
      const res = await fetch('/api/boards');
      if (res.status === 401) {
        window.location.href = '/login';
        return;
      }
      const boards = await res.json();

      if (!Array.isArray(boards) || boards.length === 0) {
        grid.innerHTML = `
          <div class="empty-state">
            <div class="empty-icon">🏐</div>
            <div class="empty-title">Henüz Skorboardunuz Yok</div>
            <p class="empty-desc">Maçlarınızı yönetmek ve OBS yayınlarınıza eklemek için hemen ilk skorboardunuzu oluşturun.</p>
            <button class="btn-nav btn-nav-primary" onclick="openCreateModal()">+ İlk Skorboardu Oluştur</button>
          </div>
        `;
        return;
      }

      grid.innerHTML = boards.map(b => {
        const teamAName = b.teamA?.name || 'EV SAHİBİ';
        const teamBName = b.teamB?.name || 'DEPLASMAN';
        const setsWonA = b.teamA?.setsWon || 0;
        const setsWonB = b.teamB?.setsWon || 0;
        const ptsA = b.teamA?.points || 0;
        const ptsB = b.teamB?.points || 0;

        const controlUrl = `${origin}/control/${b.id}`;
        const operateUrl = `${origin}/operate/${b.id}`;
        const overlayTopUrl = `${origin}/overlay/${b.id}?theme=topbar`;
        const overlayBottomUrl = `${origin}/overlay/${b.id}?theme=bottom`;
        const overlayMiniUrl = `${origin}/overlay/${b.id}?theme=mini`;
        const liveUrl = `${origin}/live/${b.id}`;

        return `
          <div class="board-card" id="card-${b.id}">
            <div>
              <div class="board-header">
                <div>
                  <div class="board-title">${escapeHtml(b.title || b.name)}</div>
                  <div class="board-sub">${escapeHtml(b.subtitle || b.id)}</div>
                </div>
                <button class="btn-delete-board" onclick="deleteBoard('${b.id}', '${escapeHtml(b.title || b.id)}')" title="Skorboardu Sil">
                  🗑️
                </button>
              </div>

              <div class="board-match-preview">
                <div class="preview-team">
                  <span>${escapeHtml(teamAName)}</span>
                </div>
                <div class="preview-score">
                  ${setsWonA} - ${setsWonB} <span style="font-size: 0.8rem; opacity: 0.8;">(${ptsA}-${ptsB})</span>
                </div>
                <div class="preview-team">
                  <span>${escapeHtml(teamBName)}</span>
                </div>
              </div>

              <!-- Kumanda Linkleri -->
              <div class="links-accordion-title">🎛️ Kumanda Bağlantıları</div>
              <div class="link-row">
                <div class="link-info" title="Tam yetkili yönetici paneli">
                  <span>👑</span>
                  <span>Yönetici Kumandası</span>
                </div>
                <div class="link-actions">
                  <button class="btn-action-sm" onclick="copyLink('${controlUrl}', this)">📋 Kopyala</button>
                  <a href="${controlUrl}" target="_blank" class="btn-action-sm btn-primary">🔗 Aç</a>
                </div>
              </div>

              <div class="link-row">
                <div class="link-info" title="Hakem/skorcuya verilecek şifresiz sadece skor girme linki">
                  <span>📱</span>
                  <span>Skorcu Kumandası (Şifresiz)</span>
                </div>
                <div class="link-actions">
                  <button class="btn-action-sm" onclick="copyLink('${operateUrl}', this)">📋 Kopyala</button>
                  <a href="${operateUrl}" target="_blank" class="btn-action-sm btn-op">🔗 Aç</a>
                </div>
              </div>

              <!-- Yayın Linkleri -->
              <div class="links-accordion-title" style="margin-top: 14px;">📺 OBS & Ekran Bağlantıları</div>
              <div class="link-row">
                <div class="link-info">
                  <span>⬆️</span>
                  <span>OBS Üst Bar (Top Bar)</span>
                </div>
                <div class="link-actions">
                  <button class="btn-action-sm" onclick="copyLink('${overlayTopUrl}', this)">📋 Kopyala</button>
                  <a href="${overlayTopUrl}" target="_blank" class="btn-action-sm">🔗 Aç</a>
                </div>
              </div>

              <div class="link-row">
                <div class="link-info">
                  <span>⬇️</span>
                  <span>OBS Alt Bant (Lower Third)</span>
                </div>
                <div class="link-actions">
                  <button class="btn-action-sm" onclick="copyLink('${overlayBottomUrl}', this)">📋 Kopyala</button>
                  <a href="${overlayBottomUrl}" target="_blank" class="btn-action-sm">🔗 Aç</a>
                </div>
              </div>

              <div class="link-row">
                <div class="link-info">
                  <span>🔲</span>
                  <span>OBS Mini Skor (Köşe Bug)</span>
                </div>
                <div class="link-actions">
                  <button class="btn-action-sm" onclick="copyLink('${overlayMiniUrl}', this)">📋 Kopyala</button>
                  <a href="${overlayMiniUrl}" target="_blank" class="btn-action-sm">🔗 Aç</a>
                </div>
              </div>

              <div class="link-row">
                <div class="link-info">
                  <span>🏟️</span>
                  <span>Salon / Seyirci Ekranı</span>
                </div>
                <div class="link-actions">
                  <button class="btn-action-sm" onclick="copyLink('${liveUrl}', this)">📋 Kopyala</button>
                  <a href="${liveUrl}" target="_blank" class="btn-action-sm">🔗 Aç</a>
                </div>
              </div>
            </div>
          </div>
        `;
      }).join('');
    } catch (e) {
      grid.innerHTML = '<div style="color: #ef4444; padding: 20px;">Skorboardlar alınırken hata oluştu.</div>';
    }
  }

  // Copy helper
  function copyLink(url, btnEl) {
    navigator.clipboard.writeText(url).then(() => {
      const orig = btnEl.textContent;
      btnEl.textContent = '✓ Kopyalandı';
      btnEl.style.color = '#ffed00';
      setTimeout(() => {
        btnEl.textContent = orig;
        btnEl.style.color = '';
      }, 1800);
    }).catch(() => {
      prompt('Bağlantıyı kopyalayın:', url);
    });
  }

  // Delete Board
  async function deleteBoard(id, name) {
    if (!confirm(`"${name}" skorboardunu silmek istediğinizden emin misiniz? Bu işlem geri alınamaz.`)) {
      return;
    }
    try {
      const res = await fetch(`/api/boards/${id}`, { method: 'DELETE' });
      const data = await res.json();
      if (res.ok && data.success) {
        const card = document.getElementById(`card-${id}`);
        if (card) card.remove();
        loadBoards();
      } else {
        alert(data.error || 'Silme başarısız oldu.');
      }
    } catch (e) {
      alert('Silme sırasında hata oluştu.');
    }
  }

  // Team Selection Handlers in Modal
  const selTeamA = document.getElementById('select-team-a');
  const selTeamB = document.getElementById('select-team-b');

  if (selTeamA) {
    selTeamA.addEventListener('change', (e) => {
      const id = e.target.value;
      const team = userTeams.find(t => t.id === id);
      if (team) {
        selectedTeamA = team;
        document.getElementById('team-a-name').value = team.name || '';
        document.getElementById('team-a-short').value = team.shortName || '';
      } else {
        selectedTeamA = null;
      }
    });
  }

  if (selTeamB) {
    selTeamB.addEventListener('change', (e) => {
      const id = e.target.value;
      const team = userTeams.find(t => t.id === id);
      if (team) {
        selectedTeamB = team;
        document.getElementById('team-b-name').value = team.name || '';
        document.getElementById('team-b-short').value = team.shortName || '';
      } else {
        selectedTeamB = null;
      }
    });
  }

  // Modal handlers
  const modal = document.getElementById('modal-new-board');
  function openCreateModal() {
    selectedTeamA = null;
    selectedTeamB = null;
    loadUserTeams();
    modal.style.display = 'flex';
    document.getElementById('board-title').focus();
  }
  function closeModal() {
    modal.style.display = 'none';
  }

  document.getElementById('btn-new-board').addEventListener('click', openCreateModal);
  document.getElementById('btn-hero-new').addEventListener('click', openCreateModal);
  document.getElementById('btn-close-modal').addEventListener('click', closeModal);
  modal.addEventListener('click', (e) => {
    if (e.target === modal) closeModal();
  });

  // Form submit
  document.getElementById('form-create-board').addEventListener('submit', async (e) => {
    e.preventDefault();
    const btn = document.getElementById('btn-submit-board');
    btn.disabled = true;
    btn.textContent = 'Oluşturuluyor...';

    const title = document.getElementById('board-title').value.trim();
    const subtitle = document.getElementById('board-subtitle').value.trim();
    const preset = document.getElementById('board-preset').value;
    const teamAName = document.getElementById('team-a-name').value.trim();
    const teamAShort = document.getElementById('team-a-short').value.trim() || teamAName.slice(0, 3).toUpperCase();
    const teamBName = document.getElementById('team-b-name').value.trim();
    const teamBShort = document.getElementById('team-b-short').value.trim() || teamBName.slice(0, 3).toUpperCase();

    const payload = {
      title,
      subtitle,
      preset,
      teamA: {
        name: teamAName,
        shortName: teamAShort,
        color: selectedTeamA ? selectedTeamA.color : undefined,
        color2: selectedTeamA ? selectedTeamA.color2 : undefined,
        accentColor: selectedTeamA ? selectedTeamA.color : undefined,
        logo: selectedTeamA ? (selectedTeamA.logo || '') : undefined
      },
      teamB: {
        name: teamBName,
        shortName: teamBShort,
        color: selectedTeamB ? selectedTeamB.color : undefined,
        color2: selectedTeamB ? selectedTeamB.color2 : undefined,
        accentColor: selectedTeamB ? selectedTeamB.color : undefined,
        logo: selectedTeamB ? (selectedTeamB.logo || '') : undefined
      }
    };

    try {
      const res = await fetch('/api/boards', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      });
      const data = await res.json();

      if (!res.ok || !data.success) {
        alert(data.error || 'Skorboard oluşturulamadı.');
        btn.disabled = false;
        btn.textContent = 'Skorboardu Oluştur';
        return;
      }

      closeModal();
      document.getElementById('form-create-board').reset();
      selectedTeamA = null;
      selectedTeamB = null;
      btn.disabled = false;
      btn.textContent = 'Skorboardu Oluştur';
      loadBoards();
    } catch (err) {
      alert('Sunucu hatası oluştu.');
      btn.disabled = false;
      btn.textContent = 'Skorboardu Oluştur';
    }
  });

  function escapeHtml(str) {
    if (!str) return '';
    return String(str)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }

  // Init
  checkAuth();
</script>

</body>
</html>
